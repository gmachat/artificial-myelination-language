[metadata]
name = artificial-myelination-language
version = attr: aml.__version__
description = An experimental agent-native programming language
long_description = file: README.md
long_description_content_type = text/markdown
author = AML contributors
classifiers =
    Development Status :: 2 - Pre-Alpha
    Environment :: Console
    Intended Audience :: Developers
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Topic :: Software Development :: Compilers
keywords = ai, compiler, programming-language, developer-tools

[options]
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
exclude =
    tests

[options.entry_points]
console_scripts =
    aml = aml.__main__:main

[options.package_data]
aml.benchmark_cases =
    *.aml
    *.js
    *.py
    *.rb
    *.go

[options.extras_require]
benchmark =
    tiktoken>=0.7
standalone =
    PyInstaller>=6.0

