name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            executable: aml
          - os: macos-13
            label: macos-x86_64
            executable: aml
          - os: macos-14
            label: macos-arm64
            executable: aml
          - os: windows-latest
            label: windows-x86_64
            executable: aml.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist/aml-${{ matrix.label }}
          cp target/release/${{ matrix.executable }} dist/aml-${{ matrix.label }}/
          cp README.md LICENSE dist/aml-${{ matrix.label }}/
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp scripts/install.ps1 dist/aml-${{ matrix.label }}/
          else
            cp scripts/install.sh dist/aml-${{ matrix.label }}/
            chmod 755 dist/aml-${{ matrix.label }}/install.sh
          fi
      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf aml-${{ matrix.label }}.tar.gz -C dist aml-${{ matrix.label }}
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/aml-${{ matrix.label }} -DestinationPath aml-${{ matrix.label }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: aml-${{ matrix.label }}
          path: aml-${{ matrix.label }}.*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: sha256sum artifacts/* > artifacts/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/* --verify-tag --generate-notes

